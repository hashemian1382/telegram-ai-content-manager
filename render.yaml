services:
  - type: web
    name: channel-hub
    runtime: python
    buildCommand: pip install .
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: channel-hub-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
databases:
  - name: channel-hub-db
    databaseName: channel_hub
    user: channel_hub

services:
  - type: web
    name: telegram-ai-content-manager
    runtime: python
    buildCommand: pip install .
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: telegram-ai-content-manager-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
databases:
  - name: telegram-ai-content-manager-db
    databaseName: telegram_ai_content_manager
    user: telegram_ai_content_manager
